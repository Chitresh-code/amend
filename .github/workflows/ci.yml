# No Neo4j service container yet: no code exercises it. Add it here when
# that lands.
#
# The "test" job runs unconditionally (no path filtering) even though this is
# a monorepo with api/ and web/: main's branch protection requires it on
# every PR, and a path-filtered job doesn't report a status at all when
# skipped, which would leave web-only PRs permanently unmergeable. The "web"
# job below is not yet in branch protection; add it once this repository has
# an admin available to update the required-checks list.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job id "test" is a required status check in main's branch protection rule;
  # keep this id stable even if the workflow is otherwise restructured.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: amend_test
          POSTGRES_USER: amend
          POSTGRES_PASSWORD: amend_test_pw
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U amend -d amend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 55432
      POSTGRES_DB: amend_test
      POSTGRES_USER: amend
      POSTGRES_PASSWORD: amend_test_pw
      REDIS_URL: redis://localhost:56379/0
      NEO4J_USER: test
      NEO4J_PASSWORD: test
      CREDENTIAL_ENCRYPTION_KEY: vv6HWttTtvs2bfSm_H_Gzh1ACRme1jRUr-wtUldclSs=
      API_KEY_HASH_PEPPER: ci-api-key-pepper
      SESSION_TOKEN_PEPPER: ci-session-pepper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: api

      - name: Install the project
        run: uv sync --locked --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Apply migrations
        run: uv run python scripts/migrate.py

      - name: Test (pytest)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite build)
        run: npm run build
